name: Survivor pool cron

# Drives the pool's scheduled jobs by calling authenticated Next.js API
# routes on the deployed site. This replaces Netlify Scheduled Functions,
# whose trigger silently stopped firing on this site — see
# lib/cron/shared.ts for the full story.
#
# Each route re-validates its own timing/eligibility (lock windows, lock
# day, dedup against the notifications table, a 20h re-entrancy floor on
# the rollover) — see the comments in each app/api/cron/*/route.ts. An
# extra or slightly-early call is safe; it just no-ops.
#
# Lock always falls on a Wednesday or Thursday evening (Thursday almost
# every week; Wednesday for the season opener and holiday weeks), always
# around NFL kickoff (~8-8:30pm ET). So the lock-adjacent jobs
# (lock-reminder, thu-reminder, post-lock-summary) only need to run a
# handful of times on those two evenings/mornings — NOT every hour of
# every day, which is 24x more calls than the real event ever needs and
# was pure waste. Their own internal guards still decide the exact moment;
# this schedule just narrows WHEN they're worth checking at all.

on:
  schedule:
    - cron: "0 12,13,0,1 * * *"  # 8am/8pm ET (EDT+EST) -> sync-scores, every day
    - cron: "0 13,14 * * 3,4"    # 9am ET (EDT+EST), Wed+Thu -> thu-reminder (lock-day morning nudge)
    - cron: "30 22,23,0,1 * * 3,4" # ~6:30-8:30pm ET (EDT+EST), Wed+Thu -> lock-reminder's 2h-before window
    - cron: "50 0,1 * * 3,4"     # ~8:50pm ET (EDT+EST), Wed+Thu -> post-lock-summary, primary check
    - cron: "20 1,2 * * 3,4"     # ~9:20pm ET (EDT+EST), Wed+Thu -> post-lock-summary, backup check (window is 60min + dedup, so this is a safety net, not a second send)
    - cron: "0 7,8 * * 2"        # Tue ~3am ET (EDT+EST) -> weekly-rollover
    - cron: "0 13,14 * * 2"      # Tue ~9am ET (EDT+EST) -> tue-summary
  workflow_dispatch: {} # manual "Run workflow" button, all jobs, for testing

jobs:
  sync-scores:
    if: github.event.schedule == '0 12,13,0,1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sync-scores
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/cron/sync-scores" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"

  thu-reminder:
    if: github.event.schedule == '0 13,14 * * 3,4' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/thu-reminder
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/cron/thu-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"

  lock-reminder:
    if: github.event.schedule == '30 22,23,0,1 * * 3,4' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/lock-reminder
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/cron/lock-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"

  post-lock-summary:
    if: github.event.schedule == '50 0,1 * * 3,4' || github.event.schedule == '20 1,2 * * 3,4' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/post-lock-summary
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/cron/post-lock-summary" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"

  weekly-rollover:
    if: github.event.schedule == '0 7,8 * * 2' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/weekly-rollover
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/cron/weekly-rollover" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"

  tue-summary:
    if: github.event.schedule == '0 13,14 * * 2' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/tue-summary
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/cron/tue-summary" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
