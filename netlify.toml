[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# No scheduled functions here anymore. Netlify Scheduled Functions silently
# stopped invoking on this site — registration was correct and manual
# "Run now" worked, but zero scheduled invocations occurred for 18+ days
# across two deploys (caught via the notifications table staying empty and
# games.updated_at staying frozen). The 5 cron jobs are now authenticated
# Next.js API routes under app/api/cron/*, called by a GitHub Actions
# schedule in .github/workflows/cron.yml — see lib/cron/shared.ts for the
# full story and lib/cron/auth.ts for the auth check.
